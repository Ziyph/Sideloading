name: Update source

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/**"
      - "source.config.json"

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror workflow builds
        run: python3 scripts/mirror.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}

      # Runs even if mirroring failed, so the other apps still get updated.
      - name: Check releases and rebuild source
        if: ${{ !cancelled() }}
        run: python3 scripts/update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs even if one app failed, so the others still get updated.
      - name: Commit changes
        if: always()
        run: |
          git add -A source*.json state.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update source"
          git push
